name: gouxu
services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    volumes:
      - state:/state
      - ./data/processed:/datasets:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.5
    stop_grace_period: 30s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${GOUXU_BIND:-127.0.0.1}:${GOUXU_PORT:-8080}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
volumes:
  state:
