server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 512;
    location = /healthz { proxy_pass http://api:8000/healthz; }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location /data/ { return 404; }
    location /assets/ { try_files $uri =404; expires 30d; }
    location / { try_files $uri $uri/ /index.html; }
}
