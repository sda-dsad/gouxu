name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r services/api/requirements.lock.txt
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: python tools/check.py
      - run: python tools/download_data.py --plan
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 tools/smoke.py --base-url http://localhost:8080
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
